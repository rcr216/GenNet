<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}GenNet — Federated Network{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Spline+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f5ef; --paper2:#efece2; --ink:#1a1a17; --ink2:#46443d; --ink3:#8a8678;
  --line:#ddd8ca; --teal:#0f7a5a; --teal-deep:#0a5a42; --teal-bg:#e6f2ec;
  --amber:#b8791a; --red:#b3402f; --green-soft:#4caf7d;
  --display:'Fraunces',Georgia,serif; --sans:'Spline Sans',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.65;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1080px;margin:0 auto;padding:0 28px}

nav{position:sticky;top:0;z-index:50;background:rgba(247,245,239,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-inner{max-width:1080px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--display);font-weight:600;font-size:23px;letter-spacing:-0.3px;color:var(--ink);text-decoration:none}
.brand .mark{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--teal),var(--teal-deep));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;font-family:var(--sans)}
.nav-links{display:flex;gap:18px;align-items:center}
.nav-links a{color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500;transition:color .15s}
.nav-links a:hover{color:var(--teal)}
.nav-cta{background:var(--teal);color:#fff !important;padding:8px 16px;border-radius:8px;font-weight:600 !important}
.nav-cta:hover{background:var(--teal-deep)}
.nav-how{background:var(--paper2);color:var(--ink) !important;padding:8px 16px;border-radius:8px;font-weight:600 !important;border:1px solid var(--line);transition:all .15s}
.nav-how:hover{border-color:var(--teal);color:var(--teal) !important;background:#fff}

main{padding:50px 0}

h1{font-family:var(--display);font-weight:600;font-size:42px;line-height:1.1;letter-spacing:-1px;margin-bottom:18px}
h2{font-family:var(--display);font-weight:600;font-size:28px;letter-spacing:-0.5px;margin:32px 0 16px}
h3{font-family:var(--display);font-weight:600;font-size:20px;margin:24px 0 10px}
p{margin-bottom:14px;color:var(--ink2);max-width:64ch}
.lede{font-size:18px;color:var(--ink2);max-width:60ch;margin-bottom:32px}

.card{background:var(--paper2);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:22px}
.card-title{font-family:var(--display);font-weight:600;font-size:20px;margin-bottom:14px;color:var(--ink)}

.btn{background:var(--teal);color:#fff;border:none;padding:12px 24px;border-radius:10px;font-weight:600;font-size:15px;cursor:pointer;font-family:var(--sans);text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all .18s;box-shadow:0 2px 0 var(--teal-deep)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--teal-deep)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal);transform:none;box-shadow:none}
.btn-danger{background:var(--red);box-shadow:0 2px 0 #7e2c1f}
.btn-danger:hover{box-shadow:0 4px 0 #7e2c1f}
.btn-sm{padding:7px 14px;font-size:13px;box-shadow:none;border-radius:7px}

.form-row{margin-bottom:18px}
label{display:block;font-weight:600;font-size:13px;color:var(--ink);margin-bottom:6px}
input[type="text"], input[type="email"], input[type="password"]{
  width:100%;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:15px;font-family:var(--sans);color:var(--ink);outline:none;transition:border-color .15s;
}
input:focus{border-color:var(--teal)}

.alert{padding:14px 18px;border-radius:10px;margin-bottom:22px;font-size:14px}
.alert-ok{background:#e8f5ec;border:1px solid #b6dcc1;color:#2a6e3f}
.alert-error{background:#fbeaea;border:1px solid #e6b9b9;color:#8a2828}
.alert-info{background:#eaf2fa;border:1px solid #b9d2e6;color:#28568a}

.code-pill{display:inline-block;font-family:var(--mono);font-weight:600;background:var(--teal-bg);color:var(--teal-deep);padding:5px 12px;border-radius:7px;font-size:13px;letter-spacing:1px}

footer{margin-top:80px;padding:32px 0 28px;border-top:1px solid var(--line);font-size:13px;color:var(--ink3)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:14px}
footer a{color:var(--teal);text-decoration:none}

.tag{display:inline-block;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;background:var(--teal-bg);color:var(--teal-deep);padding:5px 12px;border-radius:5px;margin-bottom:14px}

{% block extra_css %}{% endblock %}
</style>
</head>
<body>

<nav>
  <div class="nav-inner">
    <a href="/" class="brand"><span class="mark">G</span>GenNet</a>
    <div class="nav-links">
      <a href="/">Network</a>
      <a href="/demo" class="nav-how">How it works</a>
      <a href="/join" class="nav-cta">Join the network</a>
    </div>
  </div>
</nav>

<main>
  <div class="wrap">
    {% block content %}{% endblock %}
  </div>
</main>

<footer>
  <div class="wrap">
    <div>GenNet — Federated Genomic Intelligence · Proof of concept</div>
    <div>Rafael Campoy Ramírez · <a href="mailto:rcr216@inlumine.ual.es">rcr216@inlumine.ual.es</a></div>
  </div>
</footer>

{% block extra_js %}{% endblock %}
</body>
</html>
